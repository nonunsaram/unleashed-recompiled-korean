name: Installer safety
on:
  push:
    paths: ['Scripts/KoreanSupport*.cs', 'Scripts/test_full_backend_v106.py', 'Scripts/Verify-InstallerManifest.ps1', '.github/workflows/installer-safety.yml']
  pull_request:
    paths: ['Scripts/KoreanSupport*.cs', 'Scripts/test_full_backend_v106.py', 'Scripts/Verify-InstallerManifest.ps1', '.github/workflows/installer-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Synthetic migration and fault tests
        shell: pwsh
        env:
          URKR_TEST_ROOT: ${{ runner.temp }}/installer-tests
        run: python Scripts/test_full_backend_v106.py
      - name: Static embedded manifest check
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/installer-tests" -Directory | Select-Object -First 1
          ./Scripts/Verify-InstallerManifest.ps1 -Installer "$($package.FullName)/package/KoreanFullSetup.exe" -Manifest "$($package.FullName)/package/Support/manifest.json"
